<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="title description">
<title id="title">OfficeAI 办公智能架构图</title>
<desc id="description">客户私有化可信环境中的组件协同与内外部模型调用。</desc>
<defs><marker id="call-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#134CFF"/></marker><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8590A5"/></marker></defs>
<rect width="1600" height="1200" fill="#F7F8FA"/>
<g font-family="MiSans, 'PingFang SC', 'Microsoft YaHei', 'Arial Unicode MS', sans-serif"><text x="48" y="59" dominant-baseline="central" font-size="48" font-weight="600" fill="#131212" data-max-width="1460">OfficeAI 办公智能</text>
<text x="48" y="117" dominant-baseline="central" font-size="26" font-weight="400" fill="#5E5E66" data-max-width="1470">组件协同与内外部 Token 供给</text>
<rect x="48" y="163" width="1130" height="860" rx="8" fill="#F7F8FA" stroke="#DFE4EE"/>
<text x="76" y="201" dominant-baseline="central" font-size="30" font-weight="600" fill="#131212" data-max-width="1060">客户私有化可信环境</text>
<rect x="76" y="247" width="1074" height="100" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="98" y="282" dominant-baseline="central" font-size="28" font-weight="600" fill="#131212" data-max-width="1030">Agent Admin｜智能体管理</text>
<text x="98" y="325.5" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="1030">身份权限 · 发布审批 · 执行审计</text>
<text x="846" y="282.5" dominant-baseline="central" font-size="21" font-weight="400" fill="#5E5E66" data-max-width="275">治理覆盖全部组件</text>
<rect x="76" y="391" width="332" height="143" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="98" y="426" dominant-baseline="central" font-size="29" font-weight="600" fill="#131212" data-max-width="288">SkillHub</text>
<text x="98" y="469.5" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="288">企业技能中心</text>
<text x="98" y="500.5" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="288">工作方法 · 版本 · 复用</text>
<rect x="447" y="391" width="332" height="143" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="469" y="426" dominant-baseline="central" font-size="29" font-weight="600" fill="#131212" data-max-width="288">Connectors</text>
<text x="469" y="469.5" dominant-baseline="central" font-size="20" font-weight="400" fill="#5E5E66" data-max-width="288">连接 OA、ERP 等已有系统</text>
<text x="469" y="500.5" dominant-baseline="central" font-size="20" font-weight="400" fill="#5E5E66" data-max-width="288">按权限查询与执行业务操作</text>
<rect x="818" y="391" width="332" height="143" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="840" y="426" dominant-baseline="central" font-size="29" font-weight="600" fill="#131212" data-max-width="288">知识库</text>
<text x="840" y="469.5" dominant-baseline="central" font-size="20" font-weight="400" fill="#5E5E66" data-max-width="288">组织知识沉淀</text>
<text x="840" y="500.5" dominant-baseline="central" font-size="20" font-weight="400" fill="#5E5E66" data-max-width="288">制度文档 · 检索引用 · 更新</text>
<rect x="76" y="625" width="1074" height="105" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="98" y="660" dominant-baseline="central" font-size="29" font-weight="600" fill="#131212" data-max-width="1030">OfficeAgent｜员工入口与任务执行</text>
<text x="98" y="703.5" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="1030">理解任务 · 调用技能与工具 · 形成成果</text>
<path d="M 242 625 L 242 534" fill="none" stroke="#134CFF" stroke-width="2" marker-end="url(#call-arrow)"/>
<text x="259" y="583" dominant-baseline="central" font-size="20" font-weight="400" fill="#134CFF" data-max-width="135">使用技能</text>
<path d="M 613 625 L 613 534" fill="none" stroke="#134CFF" stroke-width="2" marker-end="url(#call-arrow)"/>
<text x="630" y="583" dominant-baseline="central" font-size="20" font-weight="400" fill="#134CFF" data-max-width="135">调用系统</text>
<path d="M 984 625 L 984 534" fill="none" stroke="#134CFF" stroke-width="2" marker-end="url(#call-arrow)"/>
<text x="1001" y="583" dominant-baseline="central" font-size="20" font-weight="400" fill="#134CFF" data-max-width="135">检索知识</text>
<rect x="76" y="825" width="350" height="163" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="98" y="860" dominant-baseline="central" font-size="29" font-weight="600" fill="#131212" data-max-width="306">私有模型服务</text>
<text x="98" y="903.5" dominant-baseline="central" font-size="20" font-weight="400" fill="#5E5E66" data-max-width="306">客户自有 / 专属算力部署</text>
<text x="98" y="934.5" dominant-baseline="central" font-size="20" font-weight="400" fill="#5E5E66" data-max-width="306">数据内部处理 · 内部额度核算</text>
<text x="96" y="805" dominant-baseline="central" font-size="22" font-weight="400" fill="#134CFF" data-max-width="300">内部 Token</text>
<rect x="680" y="825" width="470" height="163" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="702" y="860" dominant-baseline="central" font-size="28" font-weight="600" fill="#131212" data-max-width="426">TokenHub｜统一模型入口</text>
<text x="702" y="903.5" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="426">模型选择 · 路由 · 配额</text>
<text x="702" y="934.5" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="426">用量计量 · 调用审计</text>
<path d="M 915 730 L 915 825" fill="none" stroke="#134CFF" stroke-width="2" marker-end="url(#call-arrow)"/>
<text x="936" y="776" dominant-baseline="central" font-size="20" font-weight="400" fill="#134CFF" data-max-width="150">模型调用</text>
<path d="M 680 906 L 426 906" fill="none" stroke="#134CFF" stroke-width="2" marker-end="url(#call-arrow)"/>
<text x="461" y="879" dominant-baseline="central" font-size="20" font-weight="400" fill="#134CFF" data-max-width="210">敏感任务仅内部</text>
<rect x="1304" y="825" width="248" height="163" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="1326" y="860" dominant-baseline="central" font-size="26" font-weight="600" fill="#131212" data-max-width="204">SaaS 模型 API</text>
<text x="1326" y="903.5" dominant-baseline="central" font-size="19" font-weight="400" fill="#5E5E66" data-max-width="204">经授权的外部服务</text>
<text x="1326" y="934.5" dominant-baseline="central" font-size="19" font-weight="400" fill="#5E5E66" data-max-width="204">外部额度 / 按调用计费</text>
<text x="1304" y="803" dominant-baseline="central" font-size="23" font-weight="400" fill="#134CFF" data-max-width="260">外部 Token · 可选</text>
<path d="M 1150 906 L 1304 906" fill="none" stroke="#134CFF" stroke-width="2" marker-end="url(#call-arrow)"/>
<text x="1188" y="862" dominant-baseline="central" font-size="20" font-weight="400" fill="#134CFF" data-max-width="125">允许外发</text>
<text x="1188" y="888.5" dominant-baseline="central" font-size="19" font-weight="400" fill="#134CFF" data-max-width="125">+ 已授权</text>
<text x="1240" y="667" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="320">调用前检查策略</text>
<text x="1240" y="701" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="320">与必要脱敏</text>
<text x="1240" y="743" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="320">支持仅使用内部模型</text>
<rect x="48" y="1041" width="1504" height="79" rx="8" fill="#FFFFFF" stroke="#DFE4EE"/>
<text x="72" y="1066" dominant-baseline="central" font-size="25" font-weight="600" fill="#131212" data-max-width="200">业务可信</text>
<text x="72" y="1097.5" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="680">场景评测 · 依据溯源 · 人工复核</text>
<text x="834" y="1066" dominant-baseline="central" font-size="25" font-weight="600" fill="#131212" data-max-width="400">数据安全可信</text>
<text x="834" y="1097.5" dominant-baseline="central" font-size="22" font-weight="400" fill="#5E5E66" data-max-width="690">可信环境 · 最小权限 · 数据边界</text>
<text x="48" y="1145.5" dominant-baseline="central" font-size="20" font-weight="400" fill="#5E5E66" data-max-width="1470">箭头表示调用请求方向，响应返回省略。</text>
<text x="48" y="1174.5" dominant-baseline="central" font-size="20" font-weight="400" fill="#5E5E66" data-max-width="1490">Token 是模型推理用量；API Key 是访问凭据，由 TokenHub 统一管理。</text></g>
</svg>
